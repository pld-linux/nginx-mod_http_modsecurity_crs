# Local rule exclusions evaluated BEFORE the CRS rules (loaded right after
# crs-setup.conf and the plugins). Use this file for runtime exclusions with
# ctl: actions, which must run before the rule they modify, e.g.
#
#   SecRule REQUEST_URI "@beginsWith /api/upload" \
#       "id:10001,phase:1,pass,nolog,ctl:ruleRemoveById=920420"
#   SecRule REQUEST_HEADERS:User-Agent "@endsWith (internal dummy connection)" \
#       "id:10002,phase:1,pass,nolog,ctl:ruleEngine=Off"
#
# Use ids in the 1-99999 range; they are reserved for local rules.
